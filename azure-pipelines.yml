trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-24.04'

variables:
  NODE_VERSION: '20.x'
  IMAGE_NAME: 'aadvi-studio-ui'

stages:

# ===========================================
# CI - Build and Validation STAGE
# ===========================================

- stage: Build_Validation
  displayName: 'CI - Build and Validation'

  jobs:

  - job: BuildAndValidate

    displayName: 'Build Validation'

    steps:

    - task: UseNode@1
      inputs:
        versionSpec: '20.x'

    - script: |
        npm install
      displayName: Install Dependencies

    - script: |
        npm run test -- --watch=false --browsers=ChromeHeadless
      displayName: 'Run Unit Tests'

    - script: |
        npm run lint
      displayName: 'Run Lint Validation'

    - script: |
        npm run build
      displayName: 'Build Angular Application'

    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        Dockerfile: Dockerfile
        repository: $(IMAGE_NAME)
        tags: |
          $(Build.BuildId)

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: 'aadvi-studio-ui'

# ===========================================
# DEV DEPLOYMENT
# ===========================================

- stage: DEV
  displayName: CD - Deploy To DEV

  dependsOn: Build_Validation

  jobs:

  - deployment: DeployToDev

    environment: 'Development'

    strategy:

      runOnce:

        deploy:

          steps:

          - download: current

          - script: |
              echo Deploying to DEV
            displayName: Deploy DEV

# ===========================================
# QA DEPLOYMENT
# ===========================================

- stage: QA
  displayName: CD - Deploy To QA

  dependsOn: DEV

  jobs:

  - deployment: DeployToQA

    environment: 'QA'

    strategy:

      runOnce:

        deploy:

          steps:

          - download: current

          - script: |
              echo Deploying to QA
            displayName: Deploy QA

# ===========================================
# SIT/Staging DEPLOYMENT
# ===========================================

- stage: STAGING
  displayName: CD - Deploy To SIT/Staging

  dependsOn: QA

  jobs:

  - deployment: DeployToStaging

    environment: 'Staging'

    strategy:

      runOnce:

        deploy:

          steps:

          - download: current

          - script: |
              echo Deploying to SIT/Staging
            displayName: Deploy SIT/Staging
