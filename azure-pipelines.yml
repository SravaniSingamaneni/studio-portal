trigger:
  branches:
    include:
      - master
      - develop
      - UI-Design

pr:
  branches:
    include:
      - master
      - develop

pool:
  vmImage: 'ubuntu-24.04'

variables:
  NODE_VERSION: '20.x'
  IMAGE_NAME: 'aadvi-studio-ui'

stages:

# ===========================================
# CI - Build and Validation 
# ===========================================

- stage: Build_Validation
  displayName: 'CI - Build and Validation'

  jobs:

  - job: BuildAndValidate
    displayName: 'Build Validation'

    steps:

    - task: UseNode@1
      inputs:
        version: '20.x'

    - script: |
        npm install
      displayName: 'Install Dependencies'

    - script: |
        google-chrome --version
      displayName: 'Verify Chrome Installation'

    - script: |
        export CHROME_BIN=/usr/bin/google-chrome
        npm run test -- --watch=false 
      displayName: 'Run Unit Tests'

    - script: |
        npm run lint
      displayName: 'Run Lint Validation'

    - script: |
        npm run build
      displayName: 'Build Angular Application'

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        Dockerfile: 'Dockerfile'
        repository: $(IMAGE_NAME)
        tags: |
          $(Build.BuildId)

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: 'aadvi-studio-ui'
      displayName: 'Publish Build Artifacts'

# ===========================================
# DEV DEPLOYMENT
# ===========================================

- stage: DEV
  displayName: 'CD - Deploy To DEV'

  dependsOn: Build_Validation

  jobs:

  - deployment: DeployToDev

    environment: 'dev'

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current

          - script: |
              echo Deploying to DEV
            displayName: 'Deploy DEV'

# ===========================================
# QA DEPLOYMENT
# ===========================================

- stage: QA
  displayName: 'CD - Deploy To QA'

  dependsOn: DEV

  jobs:

  - deployment: DeployToQA

    environment: 'qa'

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current

          - script: |
              echo Deploying to QA
            displayName: 'Deploy QA'

# ===========================================
# SIT / STAGING DEPLOYMENT
# ===========================================

- stage: STAGING
  displayName: 'CD - Deploy To SIT/Staging'

  dependsOn: QA

  jobs:

  - deployment: DeployToStaging

    environment: 'staging'

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current

          - script: |
              echo Deploying to SIT/Staging
            displayName: 'Deploy SIT/Staging'
